[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dispatcher-v2"
version = "2.3.0a0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
codex-dispatcher = "dispatcher.__main__:main"
worktree-cleanup = "dispatcher.tools.worktree_cleanup:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dispatcher = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
