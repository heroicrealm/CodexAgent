[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-dispatcher"
version = "0.1.0"
description = "Local infrastructure for a configurable Codex task dispatcher"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
codex-dispatcher = "dispatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
