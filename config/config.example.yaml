# V2 config example. Relative paths resolve from dispatcher.root_path.
# Configure a NEW V2 test repository before integration testing.
# Projects inherit dispatcher.labels; individual labels may be overridden per project.
dispatcher:
  root_path: /home/user/codex-dispatcher
  workspace: workspace
  database: runtime/dispatcher.sqlite3
  poll_interval: 30
  codex_command: ["codex", "exec", "--sandbox", "workspace-write", "-"]
  debug:
    mode: 'off'
    retention_days: 7
  labels:
    codex-ready: "dispatcher:codex-ready"
    discovered: "dispatcher:discovered"
    approve: "dispatcher:approve"
    awaiting-children: "dispatcher:awaiting-children"
    pending: "dispatcher:pending"
    running: "dispatcher:running"
    manual-running: "dispatcher:manual-running"
    review: "dispatcher:review"
    rejected: "dispatcher:rejected"
    done: "dispatcher:done"
    cancelled: "dispatcher:cancelled"
    error: "dispatcher:error"
    need-fix: "dispatcher:need-fix"
# preparing is an internal SQLite state and has no GitHub status label.
# Example project overrides:
# projects:
#   - id: test-project
#     repository: owner/new-v2-test
#     base_branch: main
#     checkout: workspace/repos/test-project # optional; otherwise cloned here
#     labels:
#       codex-ready: "custom-ready"
#       review: "custom-review"
projects: []
