dispatcher:
  # Natural drain works without delegated cgroups. Only stop --force sends signals.
  poll_interval_seconds: 30
  emergency_poll_interval_seconds: 5 # Independent checks of active attempts.
  max_parallel_tasks: 1
  shutdown_policy: wait
  force_grace_timeout_seconds: 5
paths:
  workspace: ~/codex-dispatcher/workspace
  logs: ~/codex-dispatcher/logs
github:
  auth_method: gh
codex:
  executable: codex
  timeout_seconds: 7200 # Diagnostic comment once per attempt; execution continues.
  # Dispatcher mode: codex exec bypasses approvals and the sandbox. Use a dedicated OS account.
  execution_mode: full-auto
  quota:
    enabled: true
    min_remaining_percent: 10
    check_interval_seconds: 300
    retry_after_reset_seconds: 60
attachments:
  max_files: 20
  max_bytes: 20971520  # Per file; maximum total is max_files * max_bytes.
  timeout_seconds: 30 # Per file including redirects and streaming.
projects:
  - id: example-project
    enabled: true
    repository: owner/repository
    base_branch: main
    # Empty or missing allowlist denies all issues.
    labels:
      # Legacy string form "ready: codex-ready" is also supported.
      ready: {name: codex-ready, color: '0E8A16', description: 'Задание готово к обработке'}
      emergency_stop: {name: 'dispatcher:emergency-stop', color: 'B60205', description: 'Адресная аварийная остановка; удалить вручную для повторного подключения'}
      discovered: {name: 'dispatcher:discovered', color: 'D4C5F9', description: 'Ожидает подтверждения'}
      approve: {name: 'dispatcher:approve', color: '0E8A16', description: 'Подтвердить выполнение'}
      reject: {name: 'dispatcher:reject', color: 'B60205', description: 'Отклонить выполнение'}
      pending: {name: 'dispatcher:pending', color: 'FBCA04', description: 'Подтверждено, ожидает запуска'}
      running: {name: 'dispatcher:running', color: '1D76DB', description: 'Задание выполняется'}
      review_on_error: {name: 'dispatcher:review-on-error', color: 'D93F0B', description: 'Терминальная ошибка; требуется ручное решение'}
      review: {name: 'dispatcher:review', color: '5319E7', description: 'Ожидает приёмки'}
      done: {name: 'dispatcher:done', color: '0E8A16', description: 'Задание принято'}
      failed: {name: 'dispatcher:failed', color: 'D93F0B', description: 'Ошибка выполнения'}
      rejected: {name: 'dispatcher:rejected', color: 'B60205', description: 'Задание отклонено'}
      revoked: {name: 'dispatcher:revoked', color: 'C2E0C6', description: 'Задание отозвано'}
      cancelled: {name: 'dispatcher:cancelled', color: 'E99695', description: 'В rejected: команда окончательной отмены; затем терминальный статус'}
      interrupted: {name: 'dispatcher:interrupted', color: 'F9D0C4', description: 'Выполнение прервано'}
    # Written by init. Missing/stale status excludes this project from processing.
    init_status: ''
    init_message: ''
    init_fingerprint: ''
    security:
      allowed_authors: [trusted-login]
executables:
  github: gh
