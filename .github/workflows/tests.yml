name: Tests
on: [push, pull_request]
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m venv /tmp/dispatcher-install
      - run: /tmp/dispatcher-install/bin/python -m pip install ".[test]"
      - run: /tmp/dispatcher-install/bin/python -m pytest -q
      - run: /tmp/dispatcher-install/bin/python -m compileall -q src tests
      - run: /tmp/dispatcher-install/bin/codex-dispatcher --help
